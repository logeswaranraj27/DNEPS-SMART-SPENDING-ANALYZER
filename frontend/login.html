<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — SmartSpend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-header">
      <a href="index.html" class="auth-brand">
        <div class="brand-icon">₹</div>
        <span>Smart<span style="color:var(--primary-600);">Spend</span></span>
      </a>
      <p style="font-size: 0.92rem; color: var(--slate-500);">Student Personal Finance & Spending Analytics</p>
    </div>

    <div class="auth-card">
      <h1 class="auth-card-title">Welcome Back</h1>
      <p class="auth-card-subtitle">Sign in to manage your budget, transactions, and goals.</p>

      <!-- Demo Quick Fill Box -->
      <div class="demo-account-box">
        <div class="demo-account-text">
          <strong>⚡ Quick Demo Mode</strong>
          Click to auto-populate demo student credentials
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary" id="btn-fill-demo">Fill Demo</button>
      </div>

      <div class="auth-alert auth-alert-error" id="auth-error-alert">
        <span>⚠️</span>
        <span id="auth-error-msg">Error signing in</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">College Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="student@college.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="login-password">Password</label>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-login-submit" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
          Sign In to Dashboard
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register for SmartSpend</a>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const demoBtn = document.getElementById('btn-fill-demo');
      if (demoBtn) {
        demoBtn.addEventListener('click', () => {
          document.getElementById('login-email').value = 'student@smartspend.edu';
          document.getElementById('login-password').value = 'Student123!';
          UI.showToast("Demo credentials loaded! Click Sign In.", "info");
        });
      }

      const form = document.getElementById('login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const submitBtn = document.getElementById('btn-login-submit');
        const alertEl = document.getElementById('auth-error-alert');
        const alertMsg = document.getElementById('auth-error-msg');

        alertEl.classList.remove('visible');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing In...';

        try {
          await window.Auth.login(email, password);
          window.location.href = 'dashboard.html';
        } catch (err) {
          alertMsg.textContent = err.message || "Failed to sign in. Please verify credentials.";
          alertEl.classList.add('visible');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to Dashboard';
        }
      });
    });
  </script>
</body>
</html>

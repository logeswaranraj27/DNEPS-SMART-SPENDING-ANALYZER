# SmartSpend Spring Boot Application Configuration
server.port=8080
spring.application.name=smartspend-backend

# Security & CORS
cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5000,http://localhost:3000,http://127.0.0.1:5500

# Firebase Configuration
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:./firebase-service-account.json}
firebase.project.id=${FIREBASE_PROJECT_ID:smart-spend-dneps}

# DNEPS AI Language Model Configuration
# Supported providers: GEMINI, OPENAI, DEMO
ai.provider=${AI_PROVIDER:GEMINI}
ai.api.key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-3.5-flash-lite}
ai.api.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

# Logging
logging.level.com.smartspend=INFO
logging.level.org.springframework.security=WARN
